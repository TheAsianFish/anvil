# `make eval-classify` on Banking77: 77 fine-grained intents, short inputs (about 12 words).
dataset:
  name: banking77
  repo: legacy-datasets/banking77
  revision: f54121560de48f2852f90be299010d1d6dc612ec
  split: train
  license: CC-BY-4.0 (Casanueva et al., 2020, PolyAI)
sample:
  size: 2500
  pool_labels: 2000
  heldout_labels: 500
  seed: 0
ceiling:
  n: 200
  instructions: |
    A customer of an online bank sent this message. Pick the intent that best describes
    what they want.
spec:
  name: banking77
  kind: classify
  instructions: |
    You route messages from customers of an online bank to the intent they express.
    The label names describe the intents.
  labels:
    - activate_my_card
    - age_limit
    - apple_pay_or_google_pay
    - atm_support
    - automatic_top_up
    - balance_not_updated_after_bank_transfer
    - balance_not_updated_after_cheque_or_cash_deposit
    - beneficiary_not_allowed
    - cancel_transfer
    - card_about_to_expire
    - card_acceptance
    - card_arrival
    - card_delivery_estimate
    - card_linking
    - card_not_working
    - card_payment_fee_charged
    - card_payment_not_recognised
    - card_payment_wrong_exchange_rate
    - card_swallowed
    - cash_withdrawal_charge
    - cash_withdrawal_not_recognised
    - change_pin
    - compromised_card
    - contactless_not_working
    - country_support
    - declined_card_payment
    - declined_cash_withdrawal
    - declined_transfer
    - direct_debit_payment_not_recognised
    - disposable_card_limits
    - edit_personal_details
    - exchange_charge
    - exchange_rate
    - exchange_via_app
    - extra_charge_on_statement
    - failed_transfer
    - fiat_currency_support
    - get_disposable_virtual_card
    - get_physical_card
    - getting_spare_card
    - getting_virtual_card
    - lost_or_stolen_card
    - lost_or_stolen_phone
    - order_physical_card
    - passcode_forgotten
    - pending_card_payment
    - pending_cash_withdrawal
    - pending_top_up
    - pending_transfer
    - pin_blocked
    - receiving_money
    - refund_not_showing_up
    - request_refund
    - reverted_card_payment
    - supported_cards_and_currencies
    - terminate_account
    - top_up_by_bank_transfer_charge
    - top_up_by_card_charge
    - top_up_by_cash_or_cheque
    - top_up_failed
    - top_up_limits
    - top_up_reverted
    - topping_up_by_card
    - transaction_charged_twice
    - transfer_fee_charged
    - transfer_into_account
    - transfer_not_received_by_recipient
    - transfer_timing
    - unable_to_verify_identity
    - verify_my_identity
    - verify_source_of_funds
    - verify_top_up
    - virtual_card_not_working
    - visa_or_mastercard
    - why_verify_identity
    - wrong_amount_of_cash_received
    - wrong_exchange_rate_for_cash_withdrawal
  teacher:
    provider: claude
    model: claude-haiku-5-5
    effort: low
  student:
    model: answerdotai/ModernBERT-base
    max_length: 64
    epochs: 12
    batch_size: 16
    learning_rate: 5.0e-5
    seed: 0
  splits:
    heldout_fraction: 0.2
    seed: 0
