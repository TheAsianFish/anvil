[project]
name = "anvil-distil"
version = "0.1.0.dev0"
description = "Distil LLM calls into small, fast task models with measured parity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "TheAsianFish" }]
keywords = ["distillation", "pytorch", "llm", "active-learning", "onnx"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.15,<2",
    "numpy>=2.2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
    "torch>=2.14,<3",
    "transformers>=5.20,<6",
    "typer>=0.27",
]

[project.optional-dependencies]
# `anvil export` (torch.onnx; optimum-onnx 0.1 pins transformers<4.58, so it is not used).
export = [
    "onnx>=1.23",
    "onnxruntime>=1.31",
    "onnxscript>=0.5",
]
# `anvil serve`: ONNX Runtime and the Rust tokenizer, no torch on the serving path.
serve = [
    "fastapi>=0.120",
    "onnxruntime>=1.31",
    "tokenizers>=0.22",
    "uvicorn>=0.38",
]

[project.scripts]
anvil = "anvil.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
    "scikit-learn>=1.9",
    "seqeval>=1.2.2",
    "types-pyyaml>=6.0.12",
]
# Dataset loaders for `make eval-*` (pulls pyarrow; kept out of the default sync and CI).
eval = [
    "datasets>=5.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
"anvil/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "anvil",
    "tests",
    "eval/classify.py",
    "eval/data.py",
    "eval/extract.py",
    "eval/frontier.py",
    "eval/render.py",
    "eval/select_study.py",
]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "tokenizers.*",
    "sklearn.*",
    "onnxruntime.*",
    "optimum.*",
    "datasets.*",
    "threadpoolctl",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls the real Claude API; needs ANTHROPIC_API_KEY (run with `make test-live`)",
]
filterwarnings = ["ignore::DeprecationWarning:transformers.*"]
