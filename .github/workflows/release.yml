name: Release

# Publishing a GitHub release builds the wheel and sdist, checks the wheel in a clean venv
# (`anvil --help` and the offline demo), then publishes to PyPI and pushes both images to GHCR.
# A manual run does the build and the check only, so the release path can be tried for free.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  build:
    name: build and check the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' anvil/__init__.py)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match anvil.__version__ $version" >&2
            exit 1
          fi
      - run: uv build --out-dir dist
      - name: clean-venv install runs `anvil --help` and the demo
        run: WHEEL="$(ls dist/anvil_distil-*.whl)" ./scripts/wheel_check.sh "$RUNNER_TEMP/wheel-check"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    # Trusted publishing: no token in the repository. PyPI must list this repository, this
    # workflow file and the `pypi` environment as a trusted publisher (RELEASE.md).
    if: github.event_name == 'release' && github.repository == 'TheAsianFish/anvil'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/anvil-distil/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    name: push images to GHCR
    needs: build
    if: github.event_name == 'release' && github.repository == 'TheAsianFish/anvil'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "cli=$repo" >> "$GITHUB_OUTPUT"
          echo "serve=$repo-serve" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the CLI image (CPU torch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.names.outputs.cli }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.cli }}:latest
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
      - name: the serving image (ONNX Runtime, no torch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          push: true
          tags: |
            ${{ steps.names.outputs.serve }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.serve }}:latest
          cache-from: type=gha,scope=serve
          cache-to: type=gha,mode=max,scope=serve
