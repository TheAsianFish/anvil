name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    name: plan is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check planning documents
        run: |
          test -f PLAN.md && test -f CONTRIBUTING.md && test -f LICENSE
          grep -q '^## Milestones' PLAN.md
  # M1 replaces this job with lint, type-check and test jobs (see CONTRIBUTING.md).
